services:
  # API Flask simulee (remplace le backoffice marketplace)
  api-marketplace:
    build: ./api
    container_name: mp_api
    ports:
      - "5000:5000"
    networks:
      - marketplace

  # Data Warehouse PostgreSQL (schemas staging / dwh / analytics)
  postgres-dwh:
    image: postgres:17
    container_name: mp_postgres_dwh
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"   # 5433 sur l'hote, 5432 en interne
    volumes:
      - pg-dwh-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d   # schema.sql joue au 1er demarrage
    networks:
      - marketplace

  # Data lake S3-compatible (raw layer)
  minio:
    image: quay.io/minio/minio:latest
    container_name: mp_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # API S3 (si conflit tp1 ClickHouse : passer en 9010:9000)
      - "9001:9001"   # Console web
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - marketplace

  # Cree le bucket data-lake au demarrage puis s'arrete
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: mp_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/data-lake;
      "
    networks:
      - marketplace

  # Orchestrateur (remplace Airflow : workflows = DAGs)
  n8n:
    image: n8nio/n8n:latest
    container_name: mp_n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      - postgres-dwh
      - minio
      - api-marketplace
    networks:
      - marketplace

  # BI / dashboards
  metabase:
    image: metabase/metabase:latest
    container_name: mp_metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data   # CRUCIAL : sinon dashboards perdus au down -v
    depends_on:
      - postgres-dwh
    networks:
      - marketplace

volumes:
  pg-dwh-data:
  minio-data:
  n8n-data:
  metabase-data:

networks:
  marketplace:
    driver: bridge
